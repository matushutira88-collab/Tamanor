name: production-provider-credential-backfill

# MANUAL, audited legacy-token -> encrypted-vault cutover. Runs a BOUNDED, resumable inventory (dry-run) or
# apply, gated behind the GitHub `Production` Environment (protection rules + required reviewers) and explicit,
# mode-specific arming inputs. Never triggers on push/PR/schedule. DATABASE_URL is read ONLY from
# secrets.PRODUCTION_DATABASE_URL and is never printed. A DEDICATED PROVIDER_VAULT_KEK is required (no
# TOKEN_ENCRYPTION_KEY fallback). All safety logic lives in the unit-tested scripts under packages/db/scripts —
# this YAML is thin orchestration only.
#
# Prohibited by construction (this workflow runs none of them): prisma migrate deploy/dev, db push, migrate reset,
# schema push, ad-hoc SQL, any provider/network call, or toggling PROVIDER_VAULT_LEGACY_FALLBACK.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (inventory only) or apply"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      environment:
        description: "Target environment (only 'production' is accepted)"
        required: true
        type: choice
        options:
          - production
      batch_size:
        description: "Accounts per batch (1..1000)"
        required: false
        type: choice
        default: "25"
        options:
          - "10"
          - "25"
          - "50"
          - "100"
      max_batches:
        description: "Max batches this run (1..25)"
        required: false
        type: choice
        default: "1"
        options:
          - "1"
          - "5"
          - "10"
          - "25"
      cursor:
        description: "Optional resume cursor (opaque account id from a previous run)"
        required: false
        type: string
      confirmation:
        description: "dry-run: INVENTORY_PROVIDER_CREDENTIALS  |  apply: MIGRATE_PROVIDER_CREDENTIALS_TO_VAULT"
        required: true
        type: string
      expected_commit:
        description: "Must equal the checked-out main SHA (GITHUB_SHA)"
        required: true
        type: string

# Never allow two provider-credential backfills to run at once; never cancel one in flight.
concurrency:
  group: production-provider-credential-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # GitHub Environment `Production` — configure required reviewers + protection rules so this job pauses for
    # manual approval before any step runs, and scope the secrets below to it.
    environment: Production
    timeout-minutes: 20
    env:
      # DB URL comes ONLY from the production secret and is never echoed.
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_DATABASE_HOST_FINGERPRINT: ${{ secrets.PRODUCTION_DATABASE_HOST_FINGERPRINT }}
      # DEDICATED vault key material (no TOKEN_ENCRYPTION_KEY fallback in this workflow).
      PROVIDER_VAULT_KEK: ${{ secrets.PROVIDER_VAULT_KEK }}
      PROVIDER_VAULT_KEY_VERSION: ${{ secrets.PROVIDER_VAULT_KEY_VERSION }}
      # Arming inputs passed via ENV (never as shell arguments).
      BACKFILL_MODE: ${{ inputs.mode }}
      BACKFILL_ENVIRONMENT: ${{ inputs.environment }}
      BACKFILL_CONFIRMATION: ${{ inputs.confirmation }}
      BACKFILL_BATCH_SIZE: ${{ inputs.batch_size }}
      BACKFILL_MAX_BATCHES: ${{ inputs.max_batches }}
      BACKFILL_CURSOR: ${{ inputs.cursor }}
    steps:
      - name: Refuse any non-main ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing: this workflow may only run on main (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Validate expected_commit equals the checked-out SHA
        run: |
          if [ "${{ inputs.expected_commit }}" != "${GITHUB_SHA}" ]; then
            echo "Refusing: expected_commit does not equal GITHUB_SHA."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @guardora/db exec prisma generate

      - name: Read-only preflight (arming + dedicated KEK 32B + migration applied + table + fingerprint)
        run: pnpm --filter @guardora/db exec tsx scripts/production-provider-credential-backfill-preflight.cli.ts

      - name: Run bounded backfill (dry-run inventory or apply) — counts-only output
        run: pnpm --filter @guardora/db exec tsx scripts/backfill-provider-credentials.cli.ts ${{ inputs.mode == 'apply' && '--apply' || '' }}

      - name: Counts-only post-run verification (fails on unusable cleared accounts)
        run: pnpm --filter @guardora/db exec tsx scripts/production-provider-credential-backfill-verify.cli.ts
