name: production-customer-projection-backfill

# MANUAL, audited backfill of the persisted customer-classification projection added by migration
# 20260901090000. Runs a BOUNDED, resumable dry-run inventory or apply, gated behind the GitHub
# `Production` Environment (protection rules + required reviewers) and explicit, mode-specific arming
# inputs. Never triggers on push/PR/schedule. DATABASE_URL is read ONLY from
# secrets.PRODUCTION_DATABASE_URL and is never printed.
#
# The backfill writes ONLY the five projection columns. It never rewrites riskLevel/riskConfidence/
# riskCategories/aiDiagnostics (the immutable diagnostic source) and never touches AutoProtectDecision.
# Rows already on the current projection version are skipped, so re-running is a no-op.
#
# Until a row is backfilled its NULL projection fails CLOSED (review_required, no accusatory category,
# capped severity), so running this is a correctness improvement, never a prerequisite for safety.
#
# Prohibited by construction (this workflow runs none of them): prisma migrate deploy/dev, db push,
# migrate reset, schema push, ad-hoc SQL, risk:reclassify-demo, or any provider/network call.
#
# Start it from a terminal, e.g.:
#   gh workflow run production-customer-projection-backfill.yml --ref main \
#     -f mode=dry-run -f environment=production \
#     -f confirmation=INVENTORY_CUSTOMER_PROJECTION -f expected_commit=$(git rev-parse origin/main)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (inventory only) or apply"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      environment:
        description: "Target environment (only 'production' is accepted)"
        required: true
        type: choice
        options:
          - production
      batch_size:
        description: "Items per batch (1..1000)"
        required: false
        type: choice
        default: "200"
        options:
          - "50"
          - "100"
          - "200"
          - "500"
      max_batches:
        description: "Max batches this run"
        required: false
        type: choice
        default: "5"
        options:
          - "1"
          - "5"
          - "10"
          - "25"
      cursor:
        description: "Optional resume cursor (opaque item id from a previous run)"
        required: false
        type: string
      confirmation:
        description: "dry-run: INVENTORY_CUSTOMER_PROJECTION  |  apply: APPLY_CUSTOMER_PROJECTION_BACKFILL"
        required: true
        type: string
      expected_commit:
        description: "Must equal the checked-out main SHA (GITHUB_SHA)"
        required: true
        type: string

# Never allow two projection backfills to run at once; never cancel one in flight.
concurrency:
  group: production-customer-projection-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # GitHub Environment `Production` — required reviewers + protection rules pause this job for manual
    # approval before any step runs, and scope the secret below to it.
    environment: Production
    timeout-minutes: 30
    env:
      # DB URL comes ONLY from the production secret and is never echoed.
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      # Arming inputs passed via ENV (never as shell arguments).
      BACKFILL_ENVIRONMENT: ${{ inputs.environment }}
      BACKFILL_CONFIRMATION: ${{ inputs.confirmation }}
      BACKFILL_BATCH_SIZE: ${{ inputs.batch_size }}
      BACKFILL_MAX_BATCHES: ${{ inputs.max_batches }}
      BACKFILL_CURSOR: ${{ inputs.cursor }}
    steps:
      - name: Refuse any non-main ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing: this workflow may only run on main (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Validate expected_commit equals the checked-out SHA
        run: |
          if [ "${{ inputs.expected_commit }}" != "${GITHUB_SHA}" ]; then
            echo "Refusing: expected_commit does not equal GITHUB_SHA."
            exit 1
          fi

      - name: Validate the mode-specific confirmation phrase
        run: |
          if [ "${{ inputs.mode }}" = "apply" ]; then
            if [ "${BACKFILL_CONFIRMATION}" != "APPLY_CUSTOMER_PROJECTION_BACKFILL" ]; then
              echo "Refusing: apply requires confirmation=APPLY_CUSTOMER_PROJECTION_BACKFILL."
              exit 1
            fi
          else
            if [ "${BACKFILL_CONFIRMATION}" != "INVENTORY_CUSTOMER_PROJECTION" ]; then
              echo "Refusing: dry-run requires confirmation=INVENTORY_CUSTOMER_PROJECTION."
              exit 1
            fi
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @guardora/db exec prisma generate

      - name: Run bounded backfill (dry-run inventory or apply) — counts-only output
        run: pnpm --filter @guardora/db exec tsx scripts/backfill-customer-projection.cli.ts ${{ inputs.mode == 'apply' && '--apply' || '' }}
