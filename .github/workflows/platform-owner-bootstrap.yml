name: platform-owner-bootstrap

# MANUAL, audited production platform-owner bootstrap. Idempotently assigns the CONFIGURED email as
# PLATFORM_OWNER via the unit-tested bootstrapPlatformOwnerFromEnv — it requires an EXISTING user, never
# creates one, and never adds an email-based authorization path (the email is used ONLY for this one-time/
# idempotent role assignment; ongoing authorization stays on User.platformRole). Gated behind the GitHub
# `production` Environment (protection rules + required reviewers) and explicit arming inputs. Never triggers
# on push/PR. DATABASE_URL is read ONLY from secrets.PRODUCTION_DATABASE_URL and is never printed. This is NOT
# a public HTTP endpoint and creates no persistent backdoor.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (only 'production' is accepted)"
        required: true
        type: choice
        options:
          - production
      owner_email:
        description: "Email of the EXISTING production user to make PLATFORM_OWNER"
        required: true
        default: "info@tamanor.com"
        type: string
      confirmation:
        description: "Type BOOTSTRAP_PLATFORM_OWNER to arm"
        required: true
        type: string

# Never allow two owner-bootstrap runs at once.
concurrency:
  group: platform-owner-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # GitHub Environment name MUST match the dashboard EXACTLY (it is "Production" with a capital P). This is
    # what scopes `secrets.PRODUCTION_DATABASE_URL` to the job — a mismatched name yields an EMPTY secret.
    # Configure required reviewers + protection rules on this Environment so the job pauses for approval.
    environment: Production
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      # OPTIONAL defense-in-depth: if set as a Production Environment secret, the CLI additionally requires the
      # target host fingerprint to match. Left unset it is skipped; the CLI still echoes the actual fingerprint
      # (never the URL) so an operator can copy it into this secret later. Never hardcode a URL/password here.
      PRODUCTION_DATABASE_HOST_FINGERPRINT: ${{ secrets.PRODUCTION_DATABASE_HOST_FINGERPRINT }}
      TAMANOR_BOOTSTRAP_PLATFORM_OWNER_EMAIL: ${{ inputs.owner_email }}
      BOOTSTRAP_ENVIRONMENT: ${{ inputs.environment }}
      BOOTSTRAP_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Refuse any non-main ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing: this workflow may only run on main (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Assert the PRODUCTION_DATABASE_URL secret is mapped (fail-closed; NEVER prints it)
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "✗ DATABASE_URL is EMPTY — the 'Production' Environment secret PRODUCTION_DATABASE_URL is not"
            echo "  mapped to this job. Confirm the secret exists in the GitHub Environment named exactly"
            echo "  'Production' and that this job's 'environment:' matches it. (Value never printed.)"
            exit 1
          fi
          echo "✓ PRODUCTION_DATABASE_URL secret is present and mapped (value hidden — never printed)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @guardora/db exec prisma generate

      - name: Assign + verify platform owner (fail-closed; never prints the URL)
        run: pnpm --filter @guardora/db exec tsx scripts/platform-owner-bootstrap.cli.ts
