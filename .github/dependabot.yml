# Dependabot policy for Tamanor:
# - automatic version-update pull requests are disabled;
# - automatic security-update pull requests are disabled in repository settings;
# - Dependabot alerts may remain enabled for manual review;
# - dependency upgrades require an approved and fully tested checkpoint.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
